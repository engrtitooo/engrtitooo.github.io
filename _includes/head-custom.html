{% assign meta_title = page.meta_title | default: page.title | default: site.title %}
{% assign meta_description = page.description | default: site.description %}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ meta_title | escape }}</title>
<meta name="description" content="{{ meta_description | escape }}">
<meta name="author" content="{{ site.author.name | escape }}">
<meta name="theme-color" content="#142b2c">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/portfolio.css' | relative_url }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Eltayeb Mohammed">
<meta property="og:title" content="{{ meta_title | escape }}">
<meta property="og:description" content="{{ meta_description | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ '/assets/images/avatar.png' | absolute_url }}">
<meta property="og:image:width" content="460">
<meta property="og:image:height" content="460">
<meta property="og:image:alt" content="Portrait of Eltayeb Mohammed">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ meta_title | escape }}">
<meta name="twitter:description" content="{{ meta_description | escape }}">
<meta name="twitter:image" content="{{ '/assets/images/avatar.png' | absolute_url }}">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": {{ site.author.name | jsonify }},
  "url": {{ '/' | absolute_url | jsonify }},
  "image": {{ '/assets/images/avatar.png' | absolute_url | jsonify }},
  "jobTitle": "Senior Mechanical Engineer and Project Manager",
  "description": {{ site.description | jsonify }},
  "sameAs": [{{ site.linkedin_url | jsonify }}, {{ site.github_url | jsonify }}]
}
</script>
